  <!-- EC2 -->
  <rect x="920" y="200" width="140" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="990" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">EC2</text>
  <text x="990" y="253" text-anchor="middle" font-size="10.5" fill="#065f46">(Kubernetes Node)</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
