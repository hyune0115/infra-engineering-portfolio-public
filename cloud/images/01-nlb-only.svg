<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="280" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#111827">1. NLB 단독 구성 (화상회의 미사용)</text>

  <!-- Cloud boundary -->
  <rect x="240" y="55" width="620" height="200" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="255" y="76" font-size="12.5" font-weight="bold" fill="#475569">Public Cloud</text>

  <!-- 관리자 -->
  <circle cx="70" cy="90" r="16" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="124" text-anchor="middle" font-size="12.5" fill="#1e293b">관리자</text>
  <line x1="100" y1="90" x2="790" y2="90" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="83" text-anchor="middle" font-size="11.5" fill="#334155">SSH</text>
  <line x1="790" y1="90" x2="790" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- 사용자 -->
  <circle cx="55" cy="170" r="13" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M35,195 q20,-18 40,0" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="80" cy="170" r="13" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M60,195 q20,-18 40,0" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="65" y="220" text-anchor="middle" font-size="12.5" fill="#1e293b">사용자</text>

  <line x1="100" y1="170" x2="280" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#a1)"/>
  <text x="190" y="160" text-anchor="middle" font-size="11.5" fill="#334155">TCP</text>

  <!-- NLB -->
  <rect x="290" y="130" width="140" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="360" y="163" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">Network</text>
  <text x="360" y="179" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">Load Balancer</text>
  <text x="360" y="195" text-anchor="middle" font-size="10.5" fill="#9a3412">(L4)</text>

  <line x1="430" y1="170" x2="600" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#a1)"/>
  <text x="515" y="160" text-anchor="middle" font-size="11.5" fill="#334155">TCP (NodePort 그대로 전달)</text>

  <!-- EC2 -->
  <rect x="610" y="130" width="140" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="680" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">EC2</text>
  <text x="680" y="183" text-anchor="middle" font-size="10.5" fill="#065f46">(Kubernetes Node)</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
