<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 340" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1180" height="340" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#111827">1. NLB 단독 구성 (화상회의 미사용)</text>

  <!-- Cloud boundary -->
  <rect x="240" y="60" width="900" height="240" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="255" y="82" font-size="12.5" font-weight="bold" fill="#475569">Public Cloud</text>

  <!-- 관리자 -->
  <circle cx="70" cy="95" r="16" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="130" text-anchor="middle" font-size="12.5" fill="#1e293b">관리자</text>
  <line x1="100" y1="95" x2="1080" y2="95" stroke="#334155" stroke-width="1.5"/>
  <text x="590" y="88" text-anchor="middle" font-size="11.5" fill="#334155">SSH</text>
  <line x1="1080" y1="95" x2="1080" y2="230" stroke="#334155" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- 사용자 -->
  <circle cx="55" cy="230" r="13" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M35,255 q20,-18 40,0" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="80" cy="230" r="13" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M60,255 q20,-18 40,0" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="65" y="280" text-anchor="middle" font-size="12.5" fill="#1e293b">사용자</text>

  <!-- port list (사용자) -->
  <g font-size="11.5" fill="#334155" text-anchor="middle">
    <text x="180" y="150">443</text>
    <text x="180" y="166">18085</text>
    <text x="180" y="182">54321</text>
    <text x="180" y="198">11887</text>
    <text x="180" y="214">10000</text>
    <text x="180" y="230">143</text>
    <text x="180" y="246">993</text>
    <text x="180" y="262">110</text>
    <text x="180" y="278">995</text>
    <text x="180" y="294">25</text>
    <text x="180" y="310">587</text>
    <text x="180" y="326">465</text>
  </g>
  <line x1="220" y1="230" x2="290" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#a1)"/>

  <!-- NLB -->
  <rect x="290" y="180" width="130" height="100" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="355" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">Network</text>
  <text x="355" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">Load</text>
  <text x="355" y="254" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">Balancer</text>

  <line x1="420" y1="230" x2="640" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#a1)"/>

  <!-- port mapping list -->
  <g font-size="11" fill="#334155">
    <text x="640" y="150">443&#160;&#160;&#160;-&gt; 31013</text>
    <text x="640" y="166">54321 -&gt; 31030</text>
    <text x="640" y="182">11887 -&gt; 31015</text>
    <text x="640" y="198">18085 -&gt; 30345</text>
    <text x="640" y="214">10000 -&gt; 31018</text>
    <text x="640" y="230">25&#160;&#160;&#160;&#160;-&gt; 31023</text>
    <text x="640" y="246">587&#160;&#160;&#160;-&gt; 31024</text>
    <text x="640" y="262">465&#160;&#160;&#160;-&gt; 31025</text>
    <text x="640" y="278">143&#160;&#160;&#160;-&gt; 31026</text>
    <text x="640" y="294">993&#160;&#160;&#160;-&gt; 31027</text>
    <text x="640" y="310">110&#160;&#160;&#160;-&gt; 31028</text>
    <text x="640" y="326">995&#160;&#160;&#160;-&gt; 31029</text>
