<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 340" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1400" height="340" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#111827">3. MetalLB + Traefik + 인바운드 프록시 구성 (AWS 외)</text>

  <!-- Cloud boundary -->
  <rect x="240" y="55" width="1120" height="260" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="255" y="76" font-size="12.5" font-weight="bold" fill="#475569">Public Cloud (AWS 외)</text>

  <!-- 관리자 -->
  <circle cx="70" cy="90" r="16" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="124" text-anchor="middle" font-size="12.5" fill="#1e293b">관리자</text>
  <line x1="100" y1="90" x2="1310" y2="90" stroke="#334155" stroke-width="1.5"/>
  <text x="700" y="83" text-anchor="middle" font-size="11.5" fill="#334155">SSH</text>
  <line x1="1310" y1="90" x2="1310" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#a3)"/>

  <!-- 사용자 -->
  <circle cx="55" cy="180" r="13" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M35,205 q20,-18 40,0" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="80" cy="180" r="13" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M60,205 q20,-18 40,0" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="65" y="230" text-anchor="middle" font-size="12.5" fill="#1e293b">사용자</text>

  <line x1="100" y1="180" x2="280" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a3)"/>

  <!-- NLB -->
  <rect x="290" y="140" width="110" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="345" y="173" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c2d12">Network</text>
  <text x="345" y="189" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c2d12">Load Balancer</text>
  <text x="345" y="204" text-anchor="middle" font-size="9.5" fill="#9a3412">(L4)</text>

  <!-- NLB -> nginx -->
  <line x1="400" y1="180" x2="470" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a3)"/>
  <text x="435" y="170" text-anchor="middle" font-size="10.5" fill="#334155">TCP/HTTP</text>

  <!-- nginx -->
  <rect x="480" y="140" width="110" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="535" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">nginx</text>
  <text x="535" y="195" text-anchor="middle" font-size="9.5" fill="#5b21b6">(단순 중계)</text>

  <!-- nginx -> MetalLB VIP -->
  <line x1="590" y1="180" x2="660" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a3)"/>
  <text x="625" y="170" text-anchor="middle" font-size="10.5" fill="#334155">TCP/HTTP</text>

  <!-- MetalLB VIP -->
  <rect x="670" y="140" width="110" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="725" y="173" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c2d12">MetalLB VIP</text>
  <text x="725" y="189" text-anchor="middle" font-size="9.5" fill="#9a3412">(L4, 내부망)</text>

  <!-- VIP -> Traefik (HTTP) -->
  <line x1="780" y1="160" x2="850" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#a3)"/>
  <text x="815" y="150" text-anchor="middle" font-size="10.5" fill="#334155">HTTP</text>

  <!-- VIP -> EC2 direct (TCP) -->
  <path d="M725,220 L725,270 L1290,270 L1290,225" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a3)"/>
  <text x="1005" y="262" text-anchor="middle" font-size="11" fill="#334155">TCP (host 라우팅 불필요 트래픽, Traefik 우회)</text>

  <!-- Traefik -->
  <rect x="860" y="140" width="110" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="915" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">Traefik</text>
  <text x="915" y="189" text-anchor="middle" font-size="9.5" fill="#1e40af">(L7, host 라우팅)</text>

  <!-- Traefik -> EC2 -->
  <line x1="970" y1="160" x2="1160" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#a3)"/>
  <text x="1065" y="150" text-anchor="middle" font-size="10.5" fill="#334155">HTTP</text>

  <!-- EC2 -->
  <rect x="1170" y="140" width="120" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="1230" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">EC2</text>
  <text x="1230" y="191" text-anchor="middle" font-size="10" fill="#065f46">(Kubernetes Node)</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
