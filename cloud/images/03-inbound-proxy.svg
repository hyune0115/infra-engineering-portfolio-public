<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 340" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1160" height="340" fill="#ffffff"/>

  <text x="580" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">MetalLB + Traefik + 인바운드 프록시 구성 (AWS 외 클라우드)</text>

  <!-- 사용자 -->
  <rect x="15" y="120" width="120" height="70" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="75" y="150" text-anchor="middle" font-size="13.5" fill="#1e1b4b">사용자</text>
  <text x="75" y="168" text-anchor="middle" font-size="10.5" fill="#4338ca">80/443/화상회의</text>

  <line x1="135" y1="155" x2="200" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- NLB -->
  <rect x="210" y="120" width="150" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="285" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">NLB (L4)</text>
  <text x="285" y="166" text-anchor="middle" font-size="10.5" fill="#9a3412">타겟 = nginx 노드 IP</text>

  <line x1="360" y1="155" x2="425" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- nginx -->
  <rect x="435" y="120" width="150" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="510" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">nginx 프록시</text>
  <text x="510" y="163" text-anchor="middle" font-size="10" fill="#5b21b6">단순 중계 (라우팅 없음)</text>

  <line x1="585" y1="155" x2="650" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- MetalLB VIP -->
  <rect x="660" y="120" width="150" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="735" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">MetalLB VIP</text>
  <text x="735" y="163" text-anchor="middle" font-size="10" fill="#9a3412">(L4, 내부망)</text>

  <line x1="810" y1="155" x2="875" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Traefik -->
  <rect x="885" y="105" width="180" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="975" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Traefik (Ingress)</text>
  <text x="975" y="148" text-anchor="middle" font-size="10" fill="#1e40af">L7 — host 기준 라우팅</text>
  <text x="975" y="164" text-anchor="middle" font-size="10" fill="#1e40af">SSL 오프로드</text>
  <text x="975" y="180" text-anchor="middle" font-size="10" fill="#1e40af">HTTP→HTTPS 리다이렉트</text>

  <line x1="975" y1="205" x2="975" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="915" y="245" width="120" height="45" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="975" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#064e3b">Pod</text>

  <!-- note -->
  <rect x="15" y="250" width="870" height="70" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="30" y="270" font-size="11.5" fill="#713f12">이유: (1) NLB→ALB 타겟팅 기능이 AWS 전용 (2) 클라우드 NLB의 타겟 설정 UI가 MetalLB의</text>
  <text x="30" y="287" font-size="11.5" fill="#713f12">floating VIP를 타겟 타입으로 지원하지 않음(MSP 정책이 아닌 플랫폼 UI 제약) — 두 제약을</text>
  <text x="30" y="304" font-size="11.5" fill="#713f12">nginx가 NLB와 MetalLB VIP 사이를 단순 중계하는 방식으로 우회, 온프레미스 구성을 그대로 재사용</text>

  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
