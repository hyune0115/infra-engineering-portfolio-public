<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="980" height="420" fill="#ffffff"/>

  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">NLB + ALB 구성</text>

  <!-- 사용자 -->
  <rect x="20" y="170" width="140" height="80" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="90" y="205" text-anchor="middle" font-size="15" fill="#1e1b4b">사용자</text>
  <text x="90" y="225" text-anchor="middle" font-size="11.5" fill="#4338ca">80/443/화상회의</text>
  <text x="90" y="240" text-anchor="middle" font-size="11.5" fill="#4338ca">그 외 포트</text>

  <!-- 상단 경로: ALB -->
  <line x1="160" y1="190" x2="260" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="195" y="145" font-size="11" fill="#334155">80/443/화상회의</text>

  <rect x="270" y="70" width="220" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Application Load Balancer</text>
  <text x="380" y="118" text-anchor="middle" font-size="11.5" fill="#1e40af">SSL 인증서 등록·오프로드</text>
  <text x="380" y="136" text-anchor="middle" font-size="11.5" fill="#1e40af">HTTP → HTTPS 리다이렉트</text>
  <text x="380" y="154" text-anchor="middle" font-size="11.5" fill="#1e40af">host 기준 라우팅</text>
  <text x="380" y="172" text-anchor="middle" font-size="11.5" fill="#1e40af">(웹 / 화상회의 도메인 분기)</text>

  <line x1="490" y1="125" x2="600" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 하단 경로: NLB -->
  <line x1="160" y1="230" x2="260" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="170" y="275" font-size="11" fill="#334155">알림/문서중앙화 등</text>

  <rect x="270" y="260" width="220" height="90" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="380" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">Network Load Balancer</text>
  <text x="380" y="308" text-anchor="middle" font-size="11.5" fill="#9a3412">(L4)</text>
  <text x="380" y="326" text-anchor="middle" font-size="11.5" fill="#9a3412">포트별 NodePort 직접 포워딩</text>

  <line x1="490" y1="305" x2="600" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- EC2 -->
  <rect x="610" y="170" width="180" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="700" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#064e3b">EC2</text>
  <text x="700" y="232" text-anchor="middle" font-size="12" fill="#065f46">(Kubernetes Node)</text>
  <text x="700" y="250" text-anchor="middle" font-size="11" fill="#065f46">NodePort로 전달</text>

  <!-- 해결 박스 -->
  <rect x="20" y="370" width="770" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="35" y="395" font-size="12.5" fill="#065f46">해결: 온프레미스용 "인바운드 프록시(웹/모바일)" 구성을 ALB 역할로 재사용 → 화상회의 라우팅·HTTPS 리다이렉트 문제 모두 해소</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
