<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1100" height="340" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#111827">2. NLB + ALB 구성 (AWS, host 기준 라우팅 필요 시)</text>

  <!-- Cloud boundary -->
  <rect x="240" y="55" width="820" height="260" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="255" y="76" font-size="12.5" font-weight="bold" fill="#475569">Public Cloud (AWS)</text>

  <!-- 관리자 -->
  <circle cx="70" cy="90" r="16" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="124" text-anchor="middle" font-size="12.5" fill="#1e293b">관리자</text>
  <line x1="100" y1="90" x2="1010" y2="90" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="83" text-anchor="middle" font-size="11.5" fill="#334155">SSH</text>
  <line x1="1010" y1="90" x2="1010" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- 사용자 -->
  <circle cx="55" cy="180" r="13" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M35,205 q20,-18 40,0" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="80" cy="180" r="13" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M60,205 q20,-18 40,0" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="65" y="230" text-anchor="middle" font-size="12.5" fill="#1e293b">사용자</text>

  <line x1="100" y1="180" x2="280" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>

  <!-- NLB -->
  <rect x="290" y="140" width="120" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="350" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">Network</text>
  <text x="350" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">Load Balancer</text>
  <text x="350" y="205" text-anchor="middle" font-size="10" fill="#9a3412">(L4)</text>

  <!-- NLB -> ALB (HTTP) -->
  <line x1="410" y1="160" x2="560" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>
  <text x="485" y="150" text-anchor="middle" font-size="11.5" fill="#334155">HTTP</text>

  <!-- NLB -> EC2 direct (TCP) -->
  <path d="M350,220 L350,270 L980,270 L980,225" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>
  <text x="665" y="262" text-anchor="middle" font-size="11.5" fill="#334155">TCP (host 라우팅 불필요 트래픽, ALB 우회)</text>

  <!-- ALB -->
  <rect x="570" y="140" width="120" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="630" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">Application</text>
  <text x="630" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">Load Balancer</text>
  <text x="630" y="205" text-anchor="middle" font-size="10" fill="#1e40af">(L7, host 라우팅)</text>

  <!-- ALB -> EC2 -->
  <line x1="690" y1="160" x2="850" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>
  <text x="770" y="150" text-anchor="middle" font-size="11.5" fill="#334155">HTTP</text>

  <!-- EC2 -->
  <rect x="860" y="140" width="120" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="920" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">EC2</text>
  <text x="920" y="191" text-anchor="middle" font-size="10" fill="#065f46">(Kubernetes Node)</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
